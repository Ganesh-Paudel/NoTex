[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notex-notes"
version = "0.1.0"
description = "Structured plain-text notes to LaTeX and PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.scripts]
notex = "notex.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "coverage>=7.6,<8",
    "mypy>=1.13,<2",
    "ruff>=0.9,<1",
    "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notex = ["py.typed", "templates/*.tex"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/notex"]
strict = true

[tool.coverage.run]
source = ["notex"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit\\(main\\(\\)\\)"]
